<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret DnB Collective</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Load Alpine.js for React-like interactivity without the build step -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Load HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { background-color: #09090b; color: #e4e4e7; }
        .selection-lime *::selection { background-color: #a3e635; color: black; }
        
        /* Ensure the scanner video feed fits cleanly inside our UI */
        #qr-reader video { object-fit: cover; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="selection-lime font-sans min-h-screen flex flex-col" x-data="secretApp()">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer group" @click="view = 'home'">
                <i data-lucide="skull" class="text-lime-400"></i>
                <h1 class="text-2xl font-black tracking-tighter text-white uppercase">
                    The Secret <span class="text-lime-400">DnB</span>
                </h1>
            </div>
            
            <button @click="view = 'cart'" class="relative flex items-center gap-2 text-zinc-300 hover:text-white transition-colors">
                <i data-lucide="shopping-cart"></i>
                <template x-if="cart.length > 0">
                    <span class="absolute -top-2 -right-2 bg-lime-400 text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full" x-text="cart.length"></span>
                </template>
            </button>
        </div>
    </header>

    <!-- HOME VIEW -->
    <main x-show="view === 'home'" class="max-w-6xl mx-auto px-6 py-12 space-y-24 flex-grow">
        
        <!-- Hero Section -->
        <section class="relative h-[60vh] rounded-2xl overflow-hidden group">
            <img :src="events[0].image" alt="Hero" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 opacity-40"/>
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/50 to-transparent"></div>
            <div class="absolute bottom-0 left-0 p-8 md:p-12">
                <div class="inline-block px-3 py-1 bg-lime-400 text-black font-bold text-sm tracking-widest uppercase mb-4">Next Event</div>
                <h2 class="text-5xl md:text-7xl font-black text-white tracking-tighter uppercase mb-4 leading-none" x-text="events[0].title"></h2>
                <div class="flex flex-wrap gap-4 text-zinc-300 font-medium mb-8">
                    <span class="flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-lime-400"></i> <span x-text="events[0].date"></span></span>
                    <span class="flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-lime-400"></i> <span x-text="events[0].location"></span></span>
                </div>
                <button @click="addToCart(events[0])" class="bg-white hover:bg-lime-400 text-black font-bold py-4 px-8 uppercase tracking-wider flex items-center gap-2 transition-all duration-300">
                    <i data-lucide="ticket" class="w-5 h-5"></i>
                    Secure Ticket - £<span x-text="events[0].price.toFixed(2)"></span>
                </button>
            </div>
        </section>

        <!-- Events Grid -->
        <section>
            <div class="flex items-center gap-4 mb-8">
                <h3 class="text-3xl font-black uppercase tracking-tighter">Upcoming Intel</h3>
                <div class="h-px bg-zinc-800 flex-1"></div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-6">
                <template x-for="event in events" :key="event.id">
                    <div class="group relative border border-zinc-800 bg-zinc-900 overflow-hidden hover:border-lime-400 transition-colors duration-300">
                        <div class="h-48 overflow-hidden">
                            <img :src="event.image" :alt="event.title" class="w-full h-full object-cover opacity-50 group-hover:opacity-70 transition-opacity" />
                        </div>
                        <div class="p-6 relative">
                            <template x-if="event.isUnderground">
                                <span class="absolute top-0 right-6 -translate-y-1/2 bg-red-600 text-white text-xs font-bold px-2 py-1 uppercase tracking-widest border border-red-400 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                                    Underground
                                </span>
                            </template>
                            
                            <h4 class="text-xl font-black uppercase mb-2" x-text="event.title"></h4>
                            <p class="text-zinc-400 text-sm mb-6 font-mono" x-text="event.date"></p>
                            
                            <template x-if="event.isUnderground">
                                <button @click="rsvpModalOpen = true" class="w-full py-3 border border-zinc-600 hover:border-white hover:bg-white hover:text-black font-bold uppercase tracking-wider transition-all">
                                    Request RSVP
                                </button>
                            </template>
                            
                            <template x-if="!event.isUnderground">
                                <button @click="addToCart(event)" class="w-full py-3 bg-lime-400 text-black hover:bg-lime-500 font-bold uppercase tracking-wider transition-all">
                                    Buy Ticket - £<span x-text="event.price.toFixed(2)"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Merch Grid -->
        <section>
            <div class="flex items-center gap-4 mb-8">
                <h3 class="text-3xl font-black uppercase tracking-tighter">Hardware (Merch)</h3>
                <div class="h-px bg-zinc-800 flex-1"></div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <template x-for="item in merch" :key="item.id">
                    <div class="group cursor-pointer">
                        <div class="aspect-square bg-zinc-900 border border-zinc-800 mb-4 overflow-hidden relative">
                            <img :src="item.image" :alt="item.title" class="w-full h-full object-cover mix-blend-luminosity group-hover:mix-blend-normal transition-all duration-500 opacity-80" />
                            <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                        </div>
                        <h4 class="font-bold uppercase tracking-tight mb-1" x-text="item.title"></h4>
                        <p class="text-lime-400 font-mono mb-3">£<span x-text="item.price.toFixed(2)"></span></p>
                        <button @click="addToCart(item)" class="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-zinc-400 hover:text-white transition-colors">
                            <i data-lucide="shirt" class="w-3 h-3"></i> Add to Cart
                        </button>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <!-- CART VIEW -->
    <main x-show="view === 'cart'" class="max-w-3xl mx-auto px-6 py-12 min-h-[80vh] w-full" style="display: none;">
        <h2 class="text-4xl font-black uppercase tracking-tighter mb-8">Your Cart</h2>
        
        <template x-if="cart.length === 0">
            <div class="text-center py-24 border border-zinc-800 bg-zinc-900/50 border-dashed">
                <i data-lucide="shopping-cart" class="mx-auto w-12 h-12 text-zinc-600 mb-4"></i>
                <p class="text-zinc-400 font-mono uppercase tracking-widest">Cart is empty</p>
                <button @click="view = 'home'" class="mt-6 text-lime-400 hover:text-lime-300 font-bold uppercase">
                    Return to intel
                </button>
            </div>
        </template>

        <template x-if="cart.length > 0">
            <div>
                <div class="space-y-4 mb-8">
                    <template x-for="(item, index) in cart" :key="index">
                        <div class="flex items-center justify-between p-4 border border-zinc-800 bg-zinc-900">
                            <div class="flex items-center gap-4">
                                <template x-if="item.type === 'ticket'">
                                    <i data-lucide="ticket" class="text-lime-400"></i>
                                </template>
                                <template x-if="item.type === 'merch'">
                                    <i data-lucide="shirt" class="text-zinc-500"></i>
                                </template>
                                <div>
                                    <h4 class="font-bold uppercase" x-text="item.title"></h4>
                                    <p class="text-sm text-zinc-400 font-mono">£<span x-text="item.price.toFixed(2)"></span></p>
                                </div>
                            </div>
                            <button @click="removeFromCart(index)" class="text-zinc-500 hover:text-red-500 transition-colors p-2">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </template>
                </div>
                
                <div class="border-t border-zinc-800 pt-8 flex flex-col items-end">
                    <div class="flex justify-between w-full md:w-1/2 items-center mb-6">
                        <span class="text-zinc-400 uppercase tracking-widest font-bold">Total</span>
                        <span class="text-3xl font-black font-mono">£<span x-text="getCartTotal().toFixed(2)"></span></span>
                    </div>
                    <button @click="checkout()" class="w-full md:w-1/2 py-4 bg-white text-black hover:bg-lime-400 font-black uppercase tracking-widest text-lg flex justify-center items-center gap-2 transition-all">
                        Checkout (Stripe) <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                    <p class="text-xs text-zinc-600 mt-4 text-center w-full md:w-1/2">
                        Secure checkout via Stripe.
                    </p>
                </div>
            </div>
        </template>
    </main>

    <!-- SUCCESS VIEW -->
    <main x-show="view === 'success'" class="max-w-3xl mx-auto px-6 py-12 min-h-[80vh] flex flex-col items-center justify-center w-full" style="display: none;">
        <i data-lucide="check-circle-2" class="w-16 h-16 text-lime-400 mb-6"></i>
        <h2 class="text-4xl font-black uppercase tracking-tighter mb-2 text-center">Payment Cleared</h2>
        <p class="text-zinc-400 mb-12 text-center">Your items are secured. Keep this screen or screenshot it for the door.</p>
        
        <div class="w-full max-w-md space-y-6">
            <template x-for="(item, index) in getTickets()" :key="index">
                <div class="border border-lime-400 bg-zinc-950 p-6 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-lime-400"></div>
                    <div class="absolute top-0 right-0 w-full h-1 bg-lime-400"></div>
                    
                    <div class="pl-4">
                        <h3 class="font-black uppercase text-xl mb-1" x-text="item.title"></h3>
                        <p class="text-sm text-zinc-400 font-mono mb-6" x-text="item.date"></p>
                        
                        <div class="bg-white p-4 rounded flex justify-center mb-6">
                            <!-- Generate a QR Code using an open API -->
                            <img :src="`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=mock-ticket-${index}&color=000000&bgcolor=ffffff`" alt="Ticket QR Code" class="w-48 h-48"/>
                        </div>
                        
                        <div class="text-center">
                            <p class="text-xs text-zinc-500 uppercase tracking-widest mb-1">Unique Token ID (Scan at door)</p>
                            <p class="text-lime-400 font-mono text-sm break-all" x-text="`mock-ticket-${index}`"></p>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="getTickets().length === 0">
                <div class="text-center p-8 border border-zinc-800 bg-zinc-900 w-full">
                    <i data-lucide="shirt" class="mx-auto w-12 h-12 text-zinc-600 mb-4"></i>
                    <h3 class="font-bold uppercase text-xl mb-2">Merch Ordered</h3>
                    <p class="text-zinc-400">Your physical hardware will be shipped to the address provided via Stripe.</p>
                    <button @click="cart = []; view = 'home';" class="mt-6 text-lime-400 hover:text-white font-bold uppercase border border-lime-400 hover:bg-lime-400 hover:text-black px-6 py-2 transition-all">
                        Back to Intel
                    </button>
                </div>
            </template>
        </div>
    </main>

    <!-- SCANNER VIEW (DOOR STAFF ONLY) -->
    <main x-show="view === 'scanner'" class="max-w-md mx-auto px-6 py-12 min-h-[80vh] flex flex-col items-center w-full" style="display: none;">
        <h2 class="text-3xl font-black uppercase tracking-tighter mb-6 text-center text-white flex items-center gap-2">
            <i data-lucide="scan" class="text-lime-400"></i> Door Scanner
        </h2>

        <div class="w-full bg-zinc-900 border border-zinc-800 relative rounded-lg overflow-hidden min-h-[300px] flex items-center justify-center">
            
            <!-- Video feed container injected by JS -->
            <div id="qr-reader" class="w-full h-full"></div>
             
            <!-- Status Overlays (Valid / Invalid / Duplicate) -->
            <template x-if="scanStatus !== 'idle'">
                <div class="absolute inset-0 z-10 flex flex-col items-center justify-center p-6 backdrop-blur-md"
                     :class="{
                         'bg-lime-500/90': scanStatus === 'valid',
                         'bg-red-600/90': scanStatus === 'invalid',
                         'bg-yellow-500/90': scanStatus === 'duplicate'
                     }">
                     
                    <template x-if="scanStatus === 'valid'">
                        <i data-lucide="check-circle" class="w-16 h-16 text-black mb-4"></i>
                    </template>
                    <template x-if="scanStatus === 'invalid'">
                        <i data-lucide="x-circle" class="w-16 h-16 text-white mb-4"></i>
                    </template>
                    <template x-if="scanStatus === 'duplicate'">
                        <i data-lucide="alert-triangle" class="w-16 h-16 text-black mb-4"></i>
                    </template>

                    <h3 class="text-3xl font-black uppercase tracking-tighter mb-2 text-center leading-none" 
                        :class="scanStatus === 'invalid' ? 'text-white' : 'text-black'" 
                        x-text="scanResult.message"></h3>
                     
                    <template x-if="scanStatus === 'duplicate'">
                        <p class="text-black font-bold uppercase mb-4 text-center">Scanned at: <br><span class="text-2xl" x-text="scanResult.time"></span></p>
                    </template>

                    <button @click="resetScanner()" class="mt-8 px-8 py-3 bg-black text-white font-bold uppercase tracking-widest border border-transparent hover:border-white transition-all">
                        Next Scan
                    </button>
                </div>
            </template>
        </div>
        
        <p class="text-zinc-500 text-sm mt-6 text-center font-mono">
            Point camera at raver's screen.
        </p>
    </main>

    <!-- RSVP MODAL -->
    <div x-show="rsvpModalOpen" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div class="bg-zinc-950 border border-zinc-800 w-full max-w-md relative" @click.away="rsvpModalOpen = false; rsvpComplete = false;">
            <button @click="rsvpModalOpen = false; rsvpComplete = false;" class="absolute top-4 right-4 text-zinc-500 hover:text-white">
                <i data-lucide="x"></i>
            </button>
            
            <div class="p-8">
                <template x-if="rsvpComplete">
                    <div class="text-center py-8">
                        <i data-lucide="qr-code" class="mx-auto w-12 h-12 text-red-500 mb-4"></i>
                        <h3 class="text-2xl font-black uppercase mb-2 text-white">RSVP Logged</h3>
                        <p class="text-zinc-400 mb-6">Your QR code and payment instructions have been sent. The location will drop 2 hours before.</p>
                        <button @click="rsvpModalOpen = false; rsvpComplete = false;" class="w-full py-3 bg-white text-black font-bold uppercase tracking-wider">
                            Close
                        </button>
                    </div>
                </template>

                <template x-if="!rsvpComplete">
                    <div>
                        <h3 class="text-2xl font-black uppercase mb-2 text-white flex items-center gap-2">
                            <i data-lucide="skull" class="text-red-500"></i> Underground RSVP
                        </h3>
                        <p class="text-sm text-zinc-400 mb-6 font-mono">
                            Location is strictly protected. Enter details to receive the encrypted payment link and door token.
                        </p>
                        
                        <form @submit.prevent="rsvpComplete = true" class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase tracking-widest text-zinc-500 mb-1">Alias / Name</label>
                                <input required type="text" class="w-full bg-zinc-900 border border-zinc-800 text-white p-3 focus:outline-none focus:border-red-500 transition-colors" placeholder="e.g. MC KILLED IT" />
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-widest text-zinc-500 mb-1">Mobile Number (For Drop)</label>
                                <input required type="tel" class="w-full bg-zinc-900 border border-zinc-800 text-white p-3 focus:outline-none focus:border-red-500 transition-colors" placeholder="+44 7..." />
                            </div>
                            
                            <div class="pt-4">
                                <button type="submit" class="w-full py-4 border border-red-500 text-red-500 hover:bg-red-500 hover:text-white font-black uppercase tracking-widest transition-all">
                                    Request Entry Token
                                </button>
                            </div>
                        </form>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-zinc-900 bg-black mt-auto py-8 text-center relative">
        <p class="text-zinc-600 font-mono text-sm uppercase tracking-widest">
            &copy; 2026 The Secret Collective. Built for the underground.
        </p>
        
        <!-- Hidden Secret Access for Door Staff -->
        <button @click="openScanner()" class="absolute bottom-4 right-4 text-zinc-800 hover:text-zinc-500 transition-colors" title="Crew Access">
            <i data-lucide="lock" class="w-5 h-5"></i>
        </button>
    </footer>

    <!-- APP LOGIC -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
        
        // Ensure icons re-render when Alpine changes the DOM
        document.addEventListener('alpine:initialized', () => {
            Alpine.effect(() => { lucide.createIcons(); });
        });

        function secretApp() {
            return {
                view: 'home', // 'home', 'cart', 'success', 'scanner'
                cart: [],
                rsvpModalOpen: false,
                rsvpComplete: false,
                
                html5QrCode: null,
                scanStatus: 'idle', // 'idle', 'valid', 'invalid', 'duplicate'
                scanResult: null,
                
                // This simulates your backend database table
                mockDatabase: {
                    'mock-ticket-0': { scanned: false, type: 'Ticket' },
                    'mock-ticket-1': { scanned: false, type: 'Ticket' },
                    'mock-ticket-2': { scanned: false, type: 'Ticket' }
                },

                init() {
                    // Safety protocol: Shut off the camera if they navigate away from the scanner via the header
                    this.$watch('view', (newView, oldView) => {
                        if (oldView === 'scanner' && newView !== 'scanner') {
                            if (this.html5QrCode) {
                                this.html5QrCode.stop().catch(e => console.log("Camera already stopped."));
                            }
                        }
                    });
                },
                
                events: [
                    {
                        id: 'evt_1', type: 'ticket', title: 'THE SECRET: WAREHOUSE PROJECT', 
                        date: 'OCT 24 / 22:00 - 05:00', location: 'SECRET WAREHOUSE, LDN', 
                        price: 15.00, isUnderground: false, 
                        image: 'https://images.unsplash.com/photo-1574156828552-32a225eefbc7?auto=format&fit=crop&q=80&w=800'
                    },
                    {
                        id: 'evt_2', type: 'rsvp', title: 'FREE PARTY // M25 RING', 
                        date: 'NOV 05 / 23:00 - ??:??', location: 'LOCATION TBA VIA TEXT', 
                        price: 0, isUnderground: true, 
                        image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800'
                    }
                ],
                
                merch: [
                    { id: 'mch_1', type: 'merch', title: 'THE SECRET LOGO TEE', price: 25.00, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=800' },
                    { id: 'mch_2', type: 'merch', title: 'HEAVYWEIGHT HOODIE', price: 45.00, image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=800' }
                ],

                addToCart(item) {
                    this.cart.push(item);
                },

                removeFromCart(index) {
                    this.cart.splice(index, 1);
                },

                getCartTotal() {
                    return this.cart.reduce((total, item) => total + item.price, 0);
                },

                getTickets() {
                    return this.cart.filter(item => item.type === 'ticket');
                },

                checkout() {
                    // This is where you would normally send the user to Stripe Checkout.
                    // For now, we just show them the success page.
                    this.view = 'success';
                    window.scrollTo(0,0);
                },

                openScanner() {
                    this.view = 'scanner';
                    this.scanStatus = 'idle';
                    this.scanResult = null;
                    window.scrollTo(0,0);
                    
                    // Allow the DOM a tiny fraction of a second to show the #qr-reader div
                    setTimeout(() => {
                        this.html5QrCode = new Html5Qrcode("qr-reader");
                        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                        
                        // Force back camera on phones
                        this.html5QrCode.start({ facingMode: "environment" }, config, this.onScanSuccess.bind(this))
                            .catch(err => {
                                console.error("Camera error:", err);
                                alert("Camera access denied or unavailable.");
                            });
                    }, 100);
                },

                onScanSuccess(decodedText) {
                    // Prevent rapid multiple scans of the same code
                    if (this.scanStatus !== 'idle') return; 

                    // Check our simulated database
                    const ticket = this.mockDatabase[decodedText];

                    if (!ticket) {
                        this.scanStatus = 'invalid';
                        this.scanResult = { message: 'INVALID / FAKE TICKET' };
                    } else if (ticket.scanned) {
                        this.scanStatus = 'duplicate';
                        this.scanResult = { message: 'ALREADY SCANNED', time: ticket.scanTime };
                    } else {
                        this.scanStatus = 'valid';
                        this.scanResult = { message: 'ENTRY GRANTED' };
                        
                        // Update the database to burn the ticket
                        ticket.scanned = true;
                        ticket.scanTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                },

                resetScanner() {
                    this.scanStatus = 'idle';
                    this.scanResult = null;
                }
            }
        }
    </script>
</body>
</html>
